<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>手機掃碼測試｜DK Computer</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:32px auto;padding:0 20px;color:#182033}button,input{font:inherit;padding:12px;max-width:100%;box-sizing:border-box}button{background:#174fa3;color:white;border:0;border-radius:8px;margin:8px 0}input{display:block;width:100%}p{line-height:1.7}svg{max-width:100%;height:auto}</style></head><body><h1>手機掃碼測試</h1><p>拿一個零件盒，找到標示 <strong>S/N</strong> 的條碼。按下方按鈕，用相機對準；辨識後核對文字，再確認帶入。</p><button type="button" data-camera-target="testCode">開啟手機相機</button><label for="testCode">掃到的編號</label><input id="testCode" autocomplete="off" placeholder="確認後顯示在這裡"><p><strong>這頁不連接資料庫，也不會新增訂單、入庫或扣庫存。</strong>可放心試掃。測試成功後，正式後台的到貨、組裝及出貨欄位也有相機按鈕。</p><details><summary>用另一個螢幕顯示測試條碼</summary><p>用電腦開這一頁，再拿手機掃下方條碼，結果應為 DK-CAMERA-TEST-001。</p><svg id="sampleCode"></svg></details><p><a href="./admin.html">前往 DK 後台</a></p><script src="./assets/vendor/JsBarcode.code128.min.js"></script><script src="./assets/vendor/quagga-1.12.1.min.js"></script><script src="./assets/vendor/jsQR-1.4.0.js"></script><script src="./camera-scan.js?v=20261107camera1"></script><script>JsBarcode('#sampleCode','DK-CAMERA-TEST-001',{format:'CODE128',height:65,width:2,margin:20});</script></body></html>
