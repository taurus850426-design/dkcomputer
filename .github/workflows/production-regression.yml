name: Production regression and isolated E2E
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare headless browser
        run: node -e "require('@sparticuz/chromium').executablePath().then(p=>require('fs').appendFileSync(process.env.GITHUB_ENV,'DK_TEST_CHROME='+p+'\n'))"
      - name: Regression, current UI and production schema in isolation
        run: npm test
