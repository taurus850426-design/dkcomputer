name: DK Market Price Update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,5,9 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch validate and build DK prices
        run: node scripts/update-market-prices.js
      - name: Validate generated data
        run: node -e "const x=require('./data/dk-market-prices.json'); if(!x.generatedAt||!x.health||!x.products) process.exit(1)"
      - name: Commit safe price overlay
        run: |
          git config user.name "dk-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dk-market-prices.json
          git diff --cached --quiet || git commit -m "chore: refresh DK market prices"
          git push
