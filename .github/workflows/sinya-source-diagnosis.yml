name: Sinya live collector verification
on:
  pull_request:
    paths:
      - '.github/workflows/sinya-source-diagnosis.yml'
      - 'scripts/sinya-source.mjs'
      - 'scripts/collect-market-sources.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/sinya-source.mjs tests/market-collectors.mjs
      - name: Verify all real source collectors
        continue-on-error: true
        run: node scripts/collect-market-sources.mjs
        env:
          DK_MARKET_OUTPUT: /tmp/sinya-response
      - uses: actions/upload-artifact@v4
        with:
          name: sinya-public-response
          path: /tmp/sinya-response
          retention-days: 1
      - name: Require verified Sinya prices
        run: node -e "const x=require('/tmp/sinya-response/health.json');if(!x.sources.sinya.ok)process.exit(1);console.log(JSON.stringify(x.sources.sinya));"
