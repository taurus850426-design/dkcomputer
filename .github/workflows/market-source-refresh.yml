name: Verified market source refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect-market-sources.mjs'
      - 'scripts/market-source-collectors.mjs'
      - '.github/workflows/market-source-refresh.yml'
  schedule:
    - cron: '17 1,5,9 * * *'
concurrency:
  group: verified-market-refresh
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/market-collectors.mjs
      - name: Collect real source feeds
        id: collect
        continue-on-error: true
        run: node scripts/collect-market-sources.mjs
      - name: Refresh formal CoolPC catalog
        id: catalog
        continue-on-error: true
        run: node scripts/sync-coolpc-catalog.mjs
      - name: Validate formal pricing rules
        run: |
          node tests/market-price-engine.test.js
          node tests/market-price-pipeline.test.js
          node tests/market-price-sources.test.js
          node --test tests/builder-catalog.mjs
      - name: Commit validated snapshots without overwriting concurrent changes
        run: |
          git config user.name 'dk-market-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/market-sources data/builder-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh verified market source snapshots'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish refreshed catalog
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Surface incomplete sources
        if: steps.collect.outcome == 'failure' || steps.catalog.outcome == 'failure'
        run: |
          cat data/market-sources/health.json >> "$GITHUB_STEP_SUMMARY"
          echo 'A source failed; last verified data was retained.' >&2
          exit 1
