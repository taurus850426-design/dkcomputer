name: Apply cancel purchase item fix

on:
  push:
    branches: [main]
    paths:
      - 0001-fix-allow-cancelling-unreceived-purchase-items.patch
      - .github/workflows/apply-cancel-purchase-item-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify fix
        run: |
          git apply 0001-fix-allow-cancelling-unreceived-purchase-items.patch
          node --check purchase-orders.js
          rm 0001-fix-allow-cancelling-unreceived-purchase-items.patch
          rm .github/workflows/apply-cancel-purchase-item-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add purchase-orders.js 0001-fix-allow-cancelling-unreceived-purchase-items.patch .github/workflows/apply-cancel-purchase-item-fix.yml
          git commit -m "fix: allow cancelling unreceived purchase items"
          git push
