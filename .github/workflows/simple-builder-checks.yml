name: Simple Builder Checks
on:
  push:
    branches: [feat/simple-pc-builder]
  pull_request:
    paths:
      - 'builder-simple.js'
      - 'builder.html'
      - 'home.js'
      - 'index.html'
      - 'admin.html'
      - 'admin3.js'
      - 'purchase-orders.js'
      - 'tests/builder-submission-flow.cjs'
      - '.github/workflows/simple-builder-checks.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax check
        run: node --check builder-simple.js
      - name: Builder submission flow regression
        run: node tests/builder-submission-flow.cjs
