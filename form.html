    <main>
      <section class="section">
        <div class="container container-form">
          <div class="page-head">
            <h1 id="formPageTitle" class="h1">不知道怎麼選？</h1>
            <p id="formPageLead" class="lead muted">填完表單會自動複製你的需求並開啟 LINE，請在對話框貼上後傳送給我們。</p>
          </div>

          <form id="demandForm" class="form-card">
            <div class="field">
              <label id="usageLabel" for="usage">用途 <span class="required">*</span></label>
              <select id="usage" required>
                <option value="">請選擇</option>
                <option value="文書">文書</option>
                <option value="遊戲">遊戲</option>
                <option value="剪輯">剪輯</option>
                <option value="其他">其他</option>
              </select>
            </div>

            <div class="field">
              <label id="budgetLabel" for="budget">預算區間 <span class="required">*</span></label>
              <select id="budget" required>
                <option value="">請選擇</option>
                <option value="3000-6000">$3,000–6,000（文書）</option>
                <option value="7000-12000">$7,000–12,000（遊戲入門）</option>
                <option value="13000-20000">$13,000–20,000（遊戲中階）</option>
                <option value="18000+">$18,000+（工作／效能）</option>
              </select>
            </div>

            <div class="field">
              <label id="usedLabel">是否接受二手</label>
              <div class="radio-row">
                <label class="radio-wrap">
                  <input type="radio" name="used" value="是" checked />
                  <span>是</span>
                </label>
                <label class="radio-wrap">
                  <input type="radio" name="used" value="否" />
                  <span>否</span>
                </label>
              </div>
            </div>

            <div class="field">
              <label id="oldPCLabel">有沒有舊電腦</label>
              <div class="radio-row">
                <label class="radio-wrap">
                  <input type="radio" name="oldPC" value="有" id="oldPCYes" />
                  <span>有</span>
                </label>
                <label class="radio-wrap">
                  <input type="radio" name="oldPC" value="沒有" id="oldPCNo" checked />
                  <span>沒有</span>
                </label>
              </div>
            </div>

            <div id="oldPcSpecBlock" class="old-pc-spec-block" hidden>
              <div class="field">
                <label class="fieldset-label">現有電腦配備規格</label>
                <p class="muted" style="font-size:13px; margin:0 0 12px;">有舊電腦可填以下欄位，方便估價或升級建議（選填）</p>
              </div>
              <div class="field">
                <label for="specCpu">CPU</label>
                <input type="text" id="specCpu" placeholder="例：i5-8400、R5 3600" />
              </div>
              <div class="field">
                <label for="specRam">記憶體</label>
                <input type="text" id="specRam" placeholder="例：8G、16G DDR4" />
              </div>
              <div class="field">
                <label for="specGpu">顯卡</label>
                <input type="text" id="specGpu" placeholder="例：GTX 1060、內顯、無" />
              </div>
              <div class="field">
                <label for="specStorage">硬碟／SSD</label>
                <input type="text" id="specStorage" placeholder="例：256G SSD + 1T HDD" />
              </div>
              <div class="field">
                <label for="specOther">其他（主機板／電源／機殼等）</label>
                <input type="text" id="specOther" placeholder="例：B360、450W、可沿用機殼" />
              </div>
            </div>

            <div class="field">
              <label for="lineId">LINE ID <span class="required">*</span></label>
              <input type="text" id="lineId" placeholder="你的 LINE ID 或手機號" required />
            </div>

            <div class="field">
              <label for="note">備註（選填）</label>
              <textarea id="note" rows="3" placeholder="例如：想玩 2K 遊戲、需要 WiFi..."></textarea>
            </div>

            <div class="form-actions">
              <button id="formSubmitBtn" type="submit" class="btn btn-primary btn-lg">複製需求並開啟 LINE（請在對話框貼上後傳送）</button>
            </div>
          </form>
        </div>
