<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>電腦自由配單｜DK電競電腦</title>
<meta name="description" content="自由挑選 CPU、主機板、記憶體、SSD、顯示卡、散熱器、機殼與電源，即時計算配置並產生可列印配單。">
<link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./builder.css?v=20261106simple1"><link rel="stylesheet" href="./builder-simple.css?v=20261106simple1">
</head>
<body>
<header class="builder-header"><a class="brand" href="./index.html">DK <span>電競電腦</span></a><nav aria-label="頁面導覽"><a href="./machine.html">買電腦</a><a href="./shop.html">線上選購</a><a href="./form.html">請店家協助</a></nav></header>
<main class="builder-shell simple-builder">
<section class="simple-hero"><p class="eyebrow">BUILD YOUR PC</p><h1>自由配電腦</h1><p>直接挑選你要的零件。右側會即時整理配置與參考總價，完成後可列印配單。</p><p id="catalogStatus" class="muted" role="status">正在載入商品與價格…</p></section>
<div id="builderFailure" class="notice" hidden><p>暫時無法取得配單資料。</p><button id="retryLoad" type="button">重新載入</button></div>
<div id="simpleLayout" class="simple-layout" hidden>
<section class="panel simple-parts" aria-labelledby="partsTitle"><div class="simple-section-head"><div><p class="eyebrow">PARTS</p><h2 id="partsTitle">選擇零件</h2></div><button id="clearBuild" class="secondary" type="button">清空配單</button></div>
<div class="fields simple-filters"><label>搜尋品牌或型號<input id="partSearch" type="search" placeholder="例如：7500F、5070、1TB" maxlength="100"></label></div>
<div id="slotList"></div>
</section>
<aside class="panel summary simple-summary"><p class="eyebrow">YOUR BUILD</p><h2>目前配單</h2><div id="buildItems"></div><div class="total"><span>零件參考總價</span><strong id="buildTotal">NT$ 0</strong></div><div id="compatibility" class="simple-compatibility"></div><p class="muted small">商品價格為目前配單資料的參考價格；實際供貨與正式售價以 DK 最終確認為準。</p><div class="simple-actions"><button id="printBuild" type="button">列印／產生配單</button><button id="copyBuild" class="secondary" type="button">複製配單</button></div><p id="actionStatus" class="muted small" role="status"></p></aside>
</div>
</main>
